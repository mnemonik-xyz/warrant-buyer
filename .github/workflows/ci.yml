name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install ruff==0.17.0
      - run: ruff check scripts tests
      - run: python -m unittest discover tests -v
      - name: The pins resolve
        run: |
          python scripts/fetch_source.py fetch
          python scripts/fetch_core.py fetch --tools-only
          python scripts/fetch_core.py verify
